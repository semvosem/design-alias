<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alias">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Alias для дизайнеров</title>
<style>
@font-face{font-family:Inter;font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/inter-cyrillic.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Inter;font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/inter-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

:root{--bg:#fff;--fg:#111;--mut:#8a8a8a;--line:#e5e5e5;--soft:#f5f5f5;--err:#d92d20}
@media (prefers-color-scheme:dark){:root{--bg:#111;--fg:#f4f4f4;--mut:#8a8a8a;--line:#2b2b2b;--soft:#1b1b1b;--err:#ff6b6b}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.4 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;touch-action:manipulation}
#app{max-width:430px;margin:0 auto;min-height:100dvh;padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))}
.screen{display:none;min-height:calc(100dvh - 48px - env(safe-area-inset-top) - env(safe-area-inset-bottom));flex-direction:column;gap:12px}
.screen.on{display:flex}

h2{font-size:15px;font-weight:600;margin-top:12px}
h2:first-child{margin-top:0}
.mut{color:var(--mut);font-size:14px}
.sp{flex:1}
.tabular{font-variant-numeric:tabular-nums}

button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:transparent;border-radius:14px;padding:15px 18px}
button.pri{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
button:active{opacity:.7}

/* экран 1 */
.trow{display:flex;gap:8px;align-items:stretch}
.field{position:relative;flex:1;min-width:0}
.field input{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:14px;padding:15px 84px 15px 16px;outline:none}
.field input:focus{border-color:var(--fg)}
.field.err input{border-color:var(--err)}
.field.err input::placeholder{color:var(--err)}
.field .x,.field .ico{position:absolute;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mut);padding:0;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:10px}
.field .x{right:42px;visibility:hidden}
.field.has .x{visibility:visible}
.field .ico{right:4px}
.i{display:inline-block;width:20px;height:20px;background:currentColor;-webkit-mask:center/contain no-repeat;mask:center/contain no-repeat}
.i-close{-webkit-mask-image:url(icons/close.svg);mask-image:url(icons/close.svg)}
.i-refresh{-webkit-mask-image:url(icons/refresh.svg);mask-image:url(icons/refresh.svg)}
.i-trash{-webkit-mask-image:url(icons/trash.svg);mask-image:url(icons/trash.svg)}
.i-thumb-up{-webkit-mask-image:url(icons/thumb-up.svg);mask-image:url(icons/thumb-up.svg)}
.i-thumb-down{-webkit-mask-image:url(icons/thumb-down.svg);mask-image:url(icons/thumb-down.svg)}
.i-crown{-webkit-mask-image:url(icons/crown.svg);mask-image:url(icons/crown.svg)}
.trash{flex:none;width:50px;padding:0;display:flex;align-items:center;justify-content:center;color:var(--fg)}
.trash.off{color:var(--mut);opacity:.4}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-12px);background:var(--bg);color:var(--fg);border:1px solid var(--mut);box-shadow:0 6px 20px rgba(0,0,0,.14);padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;width:max-content;max-width:calc(100% - 40px);text-align:center;z-index:10}
#toast.on{opacity:1;transform:translate(-50%,0)}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:13px 4px;font-size:15px;white-space:nowrap}
.seg button[aria-checked=true]{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.switch{width:51px;height:31px;padding:0;border-radius:16px;background:var(--line);border:0;position:relative;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:var(--bg);transition:transform .15s}
.switch[aria-checked=true]{background:var(--fg)}
.switch[aria-checked=true]::after{transform:translateX(20px)}

/* общее */
h1{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.sub{color:var(--mut);font-size:15px;margin-top:-6px}
.list{display:flex;flex-direction:column;gap:6px}
.team{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:14px}
.team b{font-weight:600;white-space:nowrap}
.team .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.team small{color:var(--mut);font-weight:400}
.place{color:var(--mut);width:18px;display:inline-block}
.link{border:0;color:var(--mut);font-size:14px;padding:10px}

/* сейчас ход */
.turn{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.1;overflow-wrap:anywhere}

/* раунд */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.clock{font-size:20px;font-weight:600;padding-top:2px}
.card{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid var(--line);border-radius:20px;padding:24px;min-height:240px}
.word{font-size:clamp(28px,9vw,40px);font-weight:700;letter-spacing:-.02em;line-height:1.15;overflow-wrap:break-word;hyphens:auto}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts button{padding:22px 8px;font-weight:600}

/* проверка слов */
#s5{height:calc(100dvh - 48px - env(safe-area-inset-top) - env(safe-area-inset-bottom));min-height:0}
.review{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 0;min-height:0;align-content:start}
.review .team{padding:8px 8px 8px 16px}
.thumbs{display:flex;gap:6px}
.thumbs button{width:44px;height:44px;padding:0;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--mut)}
.thumbs button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.thumbs .i{width:22px;height:22px}
.crownwrap{margin-left:8px}
.crownwrap .i{vertical-align:-3px}
.total{font-size:28px;font-weight:700;letter-spacing:-.02em;text-align:center;margin:4px 0}

</style>
</head>
<body>
<div id="app">

<section id="s1" class="screen on">
  <h1>Alias для дизайнеров</h1>
  <h2>Названия команд</h2>
  <div id="teams" class="list"></div>
  <button id="add">Добавить команду</button>

  <h2>Настройки</h2>
  <div class="mut">Количество очков</div>
  <div class="seg" id="g-target" role="radiogroup" aria-label="Количество очков"></div>
  <div class="mut" style="margin-top:6px">Время раунда</div>
  <div class="seg" id="g-time" role="radiogroup" aria-label="Время раунда"></div>
  <div class="row"><span>Штраф за пропуск</span><button class="switch" id="penalty" role="switch" aria-checked="true" aria-label="Штраф за пропуск"></button></div>

  <div class="sp"></div>
  <button class="pri" id="next">Далее</button>
</section>

<section id="s2" class="screen">
  <h1>Сейчас ход команды</h1>
  <div class="sub" id="turnRound"></div>
  <div class="sp"></div>
  <div class="turn" id="turn"></div>
  <div class="sp"></div>
  <button class="pri" id="go">Поехали</button>
  <button class="link" id="reset">Новая игра</button>
</section>

<section id="s3" class="screen">
  <div class="top"><h1 id="rTeam"></h1><span class="clock tabular" id="clock"></span></div>
  <div class="sub tabular" id="rSub"></div>
  <div class="card"><div class="word" id="word"></div></div>
  <div class="acts">
    <button id="skip">Пропустить</button>
    <button class="pri" id="hit">Отгадали</button>
  </div>
</section>

<section id="s5" class="screen">
  <h1>Проверка слов</h1>
  <div class="sub" id="vSub"></div>
  <div id="review" class="list review"></div>
  <div class="total tabular" id="vTotal"></div>
  <button class="pri" id="done">Дальше</button>
</section>

<section id="s6" class="screen">
  <h1>Подсчёт очков</h1>
  <div class="sub tabular" id="bSub"></div>
  <div id="board" class="list"></div>
  <div class="sp"></div>
  <button class="pri" id="cont">Дальше</button>
  <button class="link" id="reset2">Новая игра</button>
</section>

<section id="s4" class="screen">
  <h1>Игра окончена</h1>
  <div id="final" class="list"></div>
  <div class="sp"></div>
  <button class="pri" id="rematch">Реванш?</button>
  <button id="again">Новая игра</button>
</section>

</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="words.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const KEY = 'alias-state-v1';
const MAX_TEAMS = 9;
const TARGETS = [[10,'10'],[20,'20'],[30,'30'],[40,'40']];
const TIMES = [[30,'30 сек'],[60,'1 минута'],[120,'2 минуты'],[300,'5 минут']];
const WORD_LIST = [...new Set(WORDS)];

let G = null;            // состояние игры
let names = [];          // названия команд на экране 1
let opts = { target: 20, time: 60, penalty: true };
let timer = null, wake = null;

/* ---------- утилиты ---------- */
const rnd = a => a[Math.floor(Math.random() * a.length)];
const norm = s => s.trim().toLowerCase();
const plural = (n, f) => { n = Math.abs(n); const m = n % 100, d = n % 10; return f[m > 10 && m < 20 ? 2 : d === 1 ? 0 : d >= 2 && d <= 4 ? 1 : 2]; };
const pts = n => `${n < 0 ? '−' : ''}${Math.abs(n)} ${plural(n, ['очко', 'очка', 'очков'])}`;
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const show = id => {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  window.scrollTo(0, 0);
  void document.body.offsetHeight; // принудительная перерисовка
};
const save = () => { try { G ? localStorage.setItem(KEY, JSON.stringify(G)) : localStorage.removeItem(KEY); } catch (e) {} };
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } };
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function pickName(taken) {
  const t = new Set(taken.map(norm));
  const pool = TEAM_NAMES.filter(n => !t.has(norm(n)));
  return pool.length ? rnd(pool) : 'Команда ' + (taken.length + 1);
}

/* ---------- экран 1 ---------- */
const ic = n => `<i class="i i-${n}"></i>`;

let toastTimer = null;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2200);
}

function renderTeams() {
  const box = $('teams'); box.innerHTML = '';
  const canDelete = names.length > 2;
  names.forEach((n, i) => {
    const row = el('div', 'trow');
    const f = el('div', 'field');
    const inp = el('input'); inp.value = n; inp.placeholder = 'Введи название команды'; inp.maxLength = 40;
    const sync = () => f.classList.toggle('has', !!inp.value);
    inp.oninput = () => { names[i] = inp.value; f.classList.remove('err'); sync(); };

    const x = el('button', 'x'); x.innerHTML = ic('close'); x.setAttribute('aria-label', 'Очистить');
    x.onclick = () => { names[i] = ''; inp.value = ''; sync(); inp.focus(); };

    const r = el('button', 'ico'); r.innerHTML = ic('refresh'); r.setAttribute('aria-label', 'Другое название');
    r.onclick = () => { names[i] = pickName(names); inp.value = names[i]; f.classList.remove('err'); sync(); };

    const d = el('button', 'trash' + (canDelete ? '' : ' off')); d.innerHTML = ic('trash');
    d.setAttribute('aria-label', 'Удалить команду'); d.setAttribute('aria-disabled', String(!canDelete));
    d.onclick = () => {
      if (!canDelete) return toast('Нужно минимум две команды');
      names.splice(i, 1); renderTeams();
    };

    sync(); f.append(inp, x, r); row.append(f, d); box.append(row);
  });
  $('add').hidden = names.length >= MAX_TEAMS;
}

function seg(id, list, key) {
  const g = $(id); g.innerHTML = '';
  list.forEach(([v, label]) => {
    const b = el('button', '', label); b.setAttribute('role', 'radio');
    b.setAttribute('aria-checked', String(opts[key] === v));
    b.onclick = () => { opts[key] = v; seg(id, list, key); };
    g.append(b);
  });
}

function initSetup() {
  names = [];
  names.push(pickName(names)); names.push(pickName(names));
  renderTeams(); seg('g-target', TARGETS, 'target'); seg('g-time', TIMES, 'time');
  $('penalty').setAttribute('aria-checked', String(opts.penalty));
  show('s1');
}

$('add').onclick = () => { if (names.length < MAX_TEAMS) { names.push(pickName(names)); renderTeams(); } };
$('penalty').onclick = () => { opts.penalty = !opts.penalty; $('penalty').setAttribute('aria-checked', String(opts.penalty)); };

$('next').onclick = () => {
  const fields = [...document.querySelectorAll('#teams .field')];
  const empty = fields.filter((f, i) => !names[i].trim());
  if (empty.length) {
    empty.forEach(f => f.classList.add('err'));
    empty[0].querySelector('input').focus();
    return;
  }
  const final = [];
  names.forEach(n => {
    let name = n.trim();
    const base = name; let k = 2;
    while (final.some(f => norm(f) === norm(name))) name = `${base} ${k++}`;
    final.push(name);
  });
  G = { screen: 's2', teams: final.map(name => ({ name, score: 0 })), target: opts.target, time: opts.time,
        penalty: opts.penalty, round: 1, cur: 0, used: [], word: null, endAt: null, log: [], last: null };
  save(); renderTurn();
};

/* ---------- общее для счёта ---------- */
const sg = n => (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n);
const entryVal = r => r.ok ? 1 : (G.penalty ? -1 : 0);
const roundTotal = () => G.log.reduce((s, r) => s + entryVal(r), 0);
const place = (list, i) => { let k = i; while (k > 0 && list[k - 1].score === list[i].score) k--; return k + 1; };
const sorted = () => G.teams.slice().sort((a, b) => b.score - a.score);

/* ---------- экран «Сейчас ход» ---------- */
function renderTurn() {
  $('turnRound').textContent = `Раунд ${G.round}`;
  $('turn').textContent = G.teams[G.cur].name;
  G.screen = 's2'; show('s2');
}

$('go').onclick = () => {
  G.log = []; G.word = nextWord(); G.endAt = Date.now() + G.time * 1000; G.screen = 's3'; save();
  renderRound(); startTimer(); lock();
};
const askReset = () => { if (confirm('Начать новую игру? Текущий счёт пропадёт.')) newGame(); };
$('reset').onclick = askReset; $('reset2').onclick = askReset;

/* ---------- игровой экран ---------- */
function nextWord() {
  let pool = WORD_LIST.filter(w => !G.used.includes(w));
  if (!pool.length) { G.used = []; pool = WORD_LIST.slice(); }
  const w = rnd(pool); G.used.push(w); return w;
}

function renderRound() {
  const t = G.teams[G.cur];
  $('rTeam').textContent = 'Ход команды ' + t.name;
  $('rSub').textContent = `Раунд ${G.round} · ${pts(t.score)}`;
  $('word').textContent = G.word;
  tick(); show('s3');
}

function left() { return Math.max(0, Math.ceil((G.endAt - Date.now()) / 1000)); }
function tick() { $('clock').textContent = fmt(left()); }

function startTimer() {
  clearInterval(timer);
  timer = setInterval(() => { tick(); if (left() <= 0) endRound(); }, 250);
}

function answer(ok) {
  if (!G || G.screen !== 's3' || left() <= 0) return;
  const r = { w: G.word, ok };
  G.log.push(r); G.teams[G.cur].score += entryVal(r);
  G.word = nextWord(); save(); renderRound();
}
$('hit').onclick = () => answer(true);
$('skip').onclick = () => answer(false);

function endRound() {
  clearInterval(timer); unlock();
  G.log = G.log || [];
  // слово, которое висело на карточке в конце времени: по умолчанию 👎, дальше решают игроки
  if (G.word) G.log.push({ w: G.word, ok: false });
  G.endAt = null; G.word = null;
  G.screen = 's5'; save(); renderReview();
}

/* ---------- проверка слов ---------- */
function renderReview() {
  const t = G.teams[G.cur];
  $('vSub').textContent = `Раунд ${G.round} · ${t.name}`;
  const box = $('review'); box.innerHTML = '';
  if (!G.log.length) box.append(el('div', 'mut', 'В этом раунде слов не было.'));
  G.log.forEach(r => {
    const row = el('div', 'team');
    const th = el('div', 'thumbs');
    [[false, 'thumb-down', 'Не засчитывать'], [true, 'thumb-up', 'Засчитать']].forEach(([v, icon, label]) => {
      const b = el('button'); b.innerHTML = ic(icon); b.setAttribute('aria-label', label); b.setAttribute('aria-pressed', String(r.ok === v));
      b.onclick = () => {
        if (r.ok === v) return;
        t.score -= entryVal(r); r.ok = v; t.score += entryVal(r);
        save(); renderReview();
      };
      th.append(b);
    });
    row.append(el('span', 'nm', r.w), th); box.append(row);
  });
  $('vTotal').textContent = 'Итого: ' + sg(roundTotal());
  show('s5');
}

$('done').onclick = () => {
  G.last = { round: G.round, name: G.teams[G.cur].name };
  if (G.cur < G.teams.length - 1) { G.cur++; }
  else {
    const max = Math.max(...G.teams.map(t => t.score));
    const leaders = G.teams.filter(t => t.score === max);
    if (max >= G.target && leaders.length === 1) { G.screen = 's4'; save(); return renderWin(); }
    G.round++; G.cur = 0;
  }
  save(); renderBoard();
};

/* ---------- промежуточный счёт ---------- */
function renderBoard() {
  $('bSub').textContent = `Раунд ${G.last.round} · Команда «${G.last.name}»`;
  const b = $('board'); b.innerHTML = '';
  const s = sorted();
  s.forEach((t, i) => {
    const r = el('div', 'team');
    const n = el('span', 'nm'); n.append(el('span', 'place tabular', String(place(s, i))), t.name);
    const sc = el('b', 'tabular', String(t.score).replace('-', '−')); sc.append(el('small', '', ` / ${G.target}`));
    r.append(n, sc); b.append(r);
  });
  G.screen = 's6'; show('s6');
}
$('cont').onclick = renderTurn;

/* не даём экрану гаснуть во время раунда */
async function lock() { try { wake = await navigator.wakeLock.request('screen'); } catch (e) {} }
function unlock() { try { wake && wake.release(); } catch (e) {} wake = null; }
document.addEventListener('visibilitychange', () => { if (!document.hidden && G && G.screen === 's3') { tick(); lock(); } });

/* ---------- финал ---------- */
function renderWin() {
  const s = sorted();
  const box = $('final'); box.innerHTML = '';
  s.forEach((t, i) => {
    const r = el('div', 'team');
    const n = el('span', 'nm'); n.append(el('span', 'place tabular', String(place(s, i))), t.name);
    if (i === 0) { const c = el('span', 'crownwrap'); c.innerHTML = ic('crown'); n.append(c); }
    const sc = el('b', 'tabular', String(t.score).replace('-', '−')); sc.append(el('small', '', ` / ${G.target}`));
    r.append(n, sc); box.append(r);
  });
  show('s4');
}

/* реванш: те же команды и настройки, счёт с нуля; последняя команда не ходит первой */
$('rematch').onclick = () => {
  const t = G.teams.map(x => ({ name: x.name, score: 0 }));
  if (t.length > 2) t.push(t.shift());
  G = { screen: 's2', teams: t, target: G.target, time: G.time, penalty: G.penalty,
        round: 1, cur: 0, used: G.used, word: null, endAt: null, log: [], last: null };
  save(); renderTurn();
};
$('again').onclick = newGame;

function newGame() { G = null; save(); initSetup(); }

/* ---------- запуск ---------- */
const saved = load();
if (saved && saved.teams && saved.screen) {
  G = saved;
  if (G.screen === 's3') {
    if (G.endAt && G.endAt > Date.now()) { renderRound(); startTimer(); lock(); } else endRound();
  } else if (G.screen === 's5') renderReview();
  else if (G.screen === 's4') renderWin();
  else if (G.screen === 's6' && G.last) renderBoard();
  else renderTurn();
  initSetupSilent();
} else initSetup();

function initSetupSilent() { names = [pickName([])]; names.push(pickName(names)); renderTeams(); seg('g-target', TARGETS, 'target'); seg('g-time', TIMES, 'time'); }

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
